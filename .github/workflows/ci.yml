# コード変更向けの CI。
#
# ドキュメント（*.md / docs/ / .claude/）だけの変更ではテストを回さない。
# ただし「ワークフローレベルの paths で起動そのものを止める」方式は採らない
# — 必須チェック（ブランチ保護）に設定した瞬間、ワークフローが起動せず
# チェックが pending のまま PR がマージ不能になるため。
# 代わりに changes ジョブで判定し、各ジョブを if: でスキップする（skipped は成功扱い）。
# 詳細は .claude/rules/github-actions.md
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    # pull_request では変更ファイル一覧を GitHub API から取得するため pull-requests: read が要る。
    # 無いと private リポジトリで changes が失敗し、後続の全ジョブが skip（= 緑）になる。
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v7

      # 判定は「除外リスト」で書く。対象リストで書くと、新しいディレクトリが
      # 増えたときに黙ってテストが走らなくなるため、安全側に倒す。
      #
      # 'some-with-excludes': いずれかの肯定パターン（'**'）に一致し、かつどの否定パターン
      # （先頭 '!'）にも一致しないファイルを対象にする。
      # 除外を '!(a|b)' の extglob 1 本で書かない — picomatch では否定になるのは先頭の '!'
      # だけで、'!(...)' の内側では '**' が 1 階層しか跨がず、docs/ の 2 階層目や
      # ルート直下の *.md を除外できない（#118）。
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: 'some-with-excludes'
          filters: |
            app:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!.claude/**'
              - '!.markdownlint-cli2.jsonc'
              - '!LICENSE'
            # workflows は対象リストで書いてよい。actionlint の検査対象は .github/workflows/
            # で閉じており、未知のファイルが増えても検査対象は増えないため fail-open にならない。
            # Makefile は actionlint のバージョン定義を持つため、その更新でも検査を走らせる。
            workflows:
              - '.github/workflows/**'
              - 'Makefile'

  # ワークフロー自体の検証。YAML 構文・${{ }} 式の型・action 入力に加え、
  # run: の中身を shellcheck に流す（人間のレビューで最も見落とされる層）。
  # コマンドとバージョンは Makefile が唯一の定義（ローカルと文字列レベルで同一にする）。
  actionlint:
    name: Workflow Lint (actionlint)
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run actionlint
        run: make actionlint

  static-check:
    name: Static Checks (lint / typecheck / build)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: front/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tsc / build は生成された Prisma Client の型を参照するため先に生成する。
      - name: Generate Prisma client
        run: pnpm exec prisma generate

      # Formatter は差分ゼロを検証する（--check）。CI が自動整形してコミットし返さない
      # （.claude/rules/static-analysis.md）。
      - name: Format check (Prettier)
        run: pnpm format

      - name: Lint (ESLint)
        run: pnpm lint

      # 未使用の export・ファイル・依存関係は ESLint では検出できない（ファイルを横断するため）。
      # 除外は front/knip.jsonc に理由付きで置く（.claude/rules/dead-code.md「検出」）。
      - name: Unused code (knip)
        run: pnpm knip

      - name: Typecheck (tsc --noEmit)
        run: pnpm exec tsc --noEmit

      # next build は静的生成時に Supabase クライアントを初期化するため、
      # ダミーの公開 env を与える（未設定だと createClient が "supabaseUrl is required" で失敗）。
      # 本番の実値は Vercel 側で設定。
      - name: Build (next build)
        run: pnpm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

  unit-test:
    name: Unit Tests (Vitest)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: front/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

  it-test:
    name: Integration Tests (Testcontainers)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      # Testcontainers 12 は Node 22+ の API（webidl.markAsUncloneable）に依存するため、
      # IT ジョブのみ Node 22 を使う（README のサポート範囲「Node.js 20 以上」内）。
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: front/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # IT は実 Prisma Client を使うため生成が必要。
      # DB は Testcontainers が Docker(ubuntu-latest に同梱)で起動するため事前準備は不要。
      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Run integration tests
        run: pnpm run test:it

  e2e-test:
    name: E2E Tests (Playwright)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: front/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Create .env.local for E2E
        run: |
          cat >> .env.local <<'EOF'
          E2E_BYPASS=1
          NEXT_PUBLIC_SUPABASE_URL=https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY=dummy-anon-key
          DATABASE_URL=postgresql://dummy:dummy@localhost:5432/dummy
          EOF

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # E2E は実 PostgreSQL(docker-compose)に対して実行する。
      # webServer は playwright.config で DATABASE_URL を compose DB に向ける（.env.local より優先）。
      - name: Start E2E database (docker-compose)
        run: pnpm run e2e:db:up

      - name: Run E2E tests
        run: pnpm run test:e2e
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: front/playwright-report/
          retention-days: 7

  scenario-test:
    name: Scenario Tests (Playwright)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: front/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Create .env.local for E2E
        run: |
          cat >> .env.local <<'EOF'
          E2E_BYPASS=1
          NEXT_PUBLIC_SUPABASE_URL=https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY=dummy-anon-key
          DATABASE_URL=postgresql://dummy:dummy@localhost:5432/dummy
          EOF

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # シナリオも E2E と同じ実 PostgreSQL(docker-compose)基盤で実行する。
      - name: Start E2E database (docker-compose)
        run: pnpm run e2e:db:up

      - name: Run scenario tests
        run: pnpm run test:scenario
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-scenario
          path: front/playwright-report/
          retention-days: 7
