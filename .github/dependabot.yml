# Dependabot 設定
#
# ワークフローが参照する action の版を自動で追随させる（#128）。
# Node 20 向け action（actions/checkout@v4 等）が Node 24 で強制実行されている状態を解消し、
# 以後の更新も手で一括置換せず、Dependabot の更新 PR をレビューしてマージする運用にする。
version: 2
updates:
  - package-ecosystem: github-actions
    # github-actions は .github/workflows/ を自動で走査するため、ルートを指定する
    directory: /
    schedule:
      interval: weekly
    # 全 action の更新を 1 PR にまとめる。更新対象がいずれも同じワークフローファイル（ci.yml 等）に
    # あるため、action ごとに分けると 1 本マージするたびに残りが競合する（#133 の運用で判明）。
    # 破壊的変更は、グループ PR の本文に並ぶ action ごとのリリースノートで確認する。
    groups:
      github-actions:
        patterns:
          - '*'
    open-pull-requests-limit: 5
    commit-message:
      # Conventional Commits に揃える（例: "chore(ci): bump actions/checkout from 4 to 6"）
      prefix: chore(ci)
